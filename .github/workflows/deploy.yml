# Deploy the product app to Cloudflare Workers.
# Secrets match Cloudflare's wrangler CI docs (and wrangler-action):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# Preview-on-PR is not wired. Fernando's public CF apps (warranty-wallet,
# snapframe-landing, casa itself) deploy from the machine / wrangler, not
# from a PR preview workflow.
#
# Legacy canvas still deploys with:
#   pnpm --filter @casa/canvas deploy
# (OpenNext + wrangler, same as before this monorepo.)

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    name: Deploy @casa/web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy
